name: CI and deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  deployments: write

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  server:
    name: Test the server
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the server and its test dependencies
        run: pip install -e ".[dev]"
        working-directory: apps/server

      - name: Run the test suite
        # Includes the integration tests, which apply db/schema.sql to a real
        # PostgreSQL and exercise the SQL the fakes cannot.
        env:
          WIKINDLE_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
        run: pytest -q
        working-directory: apps/server

  web:
    name: Build the frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Build
        run: npm run build -- --output-path dist/cloudflare
        working-directory: apps/web

  publish-image:
    name: Publish the server image
    needs: [server, web]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/server
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Reaches the box over SSH through the Cloudflare Tunnel, as a key that can
  # run deploy/rollout.sh and nothing else. Skipped until DEPLOY_SSH_HOST is
  # set, so the workflow stays green on a repository that has not been wired up.
  # See docs/adr/0009-ci-rolls-out-over-ssh-through-the-tunnel.md.
  deploy-server:
    name: Roll out the server
    needs: publish-image
    if: vars.DEPLOY_SSH_HOST != ''
    runs-on: ubuntu-latest

    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Roll out
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          # cloudflared reads the Access service token from these two.
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ProxyCommand='cloudflared access ssh --hostname %h' \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST"

      - name: Wait for the API
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors https://api.wikindle.xyz/api/health

  deploy-web:
    name: Deploy the frontend
    needs: [server, web]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Build
        run: npm run build -- --output-path dist/cloudflare
        working-directory: apps/web

      - name: Normalize Angular output
        shell: bash
        working-directory: apps/web
        run: |
          set -euo pipefail

          rm -rf dist/pages
          mkdir -p dist/pages

          if [ -d dist/cloudflare/browser ]; then
            cp -a dist/cloudflare/browser/. dist/pages/
          else
            cp -a dist/cloudflare/. dist/pages/
          fi

          test -f dist/pages/index.html

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages deploy dist/pages --project-name=wikindle-web --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
