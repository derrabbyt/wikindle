[project]
name = "wikindle"
version = "0.1.0"
description = "One Wikipedia article a day, delivered to your Kindle as an EPUB"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pillow>=11",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.7",
    "requests>=2.32",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "db: integration test requiring WIKINDLE_DATABASE_URL",
    "network: test that reaches the live internet",
]
addopts = "-m 'not network'"
